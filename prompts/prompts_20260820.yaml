# 20260820 首图风格编辑
# 用法：改 active.style 和 styles 里对应条目即可；template 一般不动。
# 拼装规则：把 template 里的【目标风格】【时间】【风格效果】替换成所选风格的字段。

active:
  source: inputs/20260820-dream/bottle-part3_first.jpg
  style: 海滨小镇
  out_dir: output/20260820-dream/first_frame
  version: v2
  n: 2

template: |-
  以参考图为基础，将场景转换为【目标风格】。只换材质、光照与背景外观，不重拍。

  硬性约束：
  - 机位、俯仰、透视、裁切与原图完全一致；禁止抬高、拉远、扩视野
  - 机械臂/夹爪造型、位置、姿态不变；两碗相对位置、大小、间距不变
  - 背景仅在原裁切范围内改为无人极简室内；不要为窗外景而改构图
  - 超写实、真实材质；输出画幅与原图一致

  风格设定：
  - 时间：【时间】
  - 风格效果：【风格效果】

styles:
  科技夜晚:
    slug: tech-night
    目标风格: 科技别墅极简家庭风格
    时间: 夜晚，明亮落地灯，无明显阴影与光源方向
    风格效果:
      科技感极简夜晚氛围；背景家具极少；原裁切内可见窗外园林夜景即可；
      桌面与两碗改为明显原木材质，与原图大理石/陶瓷拉开差距。

  黄金时刻:
    slug: golden-hour
    目标风格: 温暖黄金时刻室内摄影风格
    时间: 低角度金色侧光，柔和长阴影，暖色调
    风格效果:
      背景家具极少、造型极简；背景需要进行大的风格替换，为大落地窗和庭院，家具装修风格都要大幅度替换；
      桌面与两碗改为深暖色实木（禁止浅石/米色大理石），与原图拉开差距。

  科技新中式:
    slug: tech-new-chinese
    目标风格: 简洁奢华的科技新中式风格
    时间: 金色漫射光，无明显阴影与光源方向
    风格效果:
      东方极简 + 轻金属点缀；背景家具极少；背景需要进行大的风格替换，为大落地窗和庭院，家具装修风格都要相应大幅度替换；
      桌面与两碗改为深色木与哑光陶瓷，与原图拉开差距。

  海滨小镇:
    slug: coastal-town
    目标风格: 海滨小镇日常住宅风格
    时间: 午前柔和日光，海风通透，暖白漫射光
    风格效果:
      窗外可见小镇港湾、白墙红瓦屋脊与海平面，开阔但不空旷；室内要有强生活气息：浅色粉刷墙、旧木地板、亚麻窗帘、低频沙发/藤编椅/边几即可；
      禁止度假酒店样板间感；桌面改为晒白实木或浅蓝漆木，两碗和小框改为哑光素陶/海边陶瓷，整体像有人常住的小镇厨房。

  都市天际线Loft:
    slug: city-skyline
    目标风格: 现代都市天际线住宅 Loft
    时间: 蓝调时刻，窗外城市灯火初上，室内暖白漫射光
    风格效果:
      保持窗外开阔城市天际线；室内改成居住感 Loft：暖色实木地板、局部裸砖或哑光石膏墙、黑色钢框落地窗、低频沙发/边几即可；
      禁止纯灰混凝土碉堡感、禁止茶具/中式托盘等东方餐具堆叠；桌面改为深暖色实木，两碗和小框改为哑光深色陶瓷，整体都市住宅而非工业厂房。
