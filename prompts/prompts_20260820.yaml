# 20260820 首图风格编辑
# 用法：改 active.style 和 styles 里对应条目即可；template 一般不动。
# 拼装规则：把 template 里的【目标风格】【时间】【风格效果】替换成所选风格的字段。

active:
  source: inputs/20260820-dream/stack-part2_first.jpg
  style: 科技夜晚
  out_dir: output/20260820-dream/first_frame
  version: v3
  n: 2

template: |-
  以参考图为基础，将场景转换为【目标风格】。

  硬性约束：
  - 保持原有前景布局、机位、视角、空间结构及主要(桌面)物体位置
  - 保持前景机械臂/夹爪的造型、位置、姿态、视角不变
  - 桌面外的背景替换为无人家庭室内，极简且低频
  - 采用建筑摄影构图、电影级光照、真实材质和高细节超写实表现
  - 输出的图片比例和结构与原图严格一致

  风格设定：
  - 时间：【时间】
  - 风格效果：【风格效果】

styles:
  科技夜晚:
    slug: tech-night
    目标风格: 科技别墅极简家庭风格
    时间: 夜晚，室内明亮落地灯光照明，无明显阴影轮廓，无明显光源方向
    风格效果: 
      明亮夜晚科技感极简家庭氛围；背景家具极少、造型极简；落地窗外可见别墅院内园林夜景；
      桌面周围包括两个碗和桌面的风格都要替换成原木风格，与原本风格拉开差距；

